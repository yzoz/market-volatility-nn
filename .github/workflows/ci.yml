name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install without TensorFlow: unit tests cover pure logic and model smoke
      # tests are skipped when TensorFlow is absent.
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyyaml typer python-dotenv pytest ruff

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Test
        run: python -m pytest -q
